<div class="admin-login-container">
  <div class="admin-login-bg"></div>
  <div class="admin-login-card animate-scaleIn">
    <div class="admin-login-header">
      <div class="admin-logo">
        <i class="fas fa-shield-alt"></i>
      </div>
      <h2>Admin Panel</h2>
      <p>Secure administrative access</p>
    </div>

    <div class="admin-login-body">
      <div *ngIf="error" class="alert alert-danger">
        <i class="fas fa-exclamation-circle"></i> {{error}}
      </div>

      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
        <div class="form-group">
          <label class="form-label">
            <i class="fas fa-envelope"></i> Admin Email
          </label>
          <input type="email" class="form-control" formControlName="email"
                 placeholder="admin@placement.com">
        </div>

        <div class="form-group">
          <label class="form-label">
            <i class="fas fa-lock"></i> Password
          </label>
          <input type="password" class="form-control" formControlName="password"
                 placeholder="Enter admin password">
        </div>

        <button type="submit" class="btn btn-danger btn-block" [disabled]="loading">
          <span *ngIf="loading" class="spinner-border spinner-border-sm me-2"></span>
          {{loading ? 'Authenticating...' : 'Admin Login'}}
        </button>
      </form>
    </div>

    <div class="admin-login-footer">
      <a routerLink="/login" class="student-link">
        <i class="fas fa-user"></i> Student Login
      </a>
      <a routerLink="/" class="back-link">
        <i class="fas fa-arrow-left"></i> Back to Home
      </a>
    </div>
  </div>
</div>
