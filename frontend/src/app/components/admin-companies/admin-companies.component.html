<div class="admin-page animate-fadeIn">
  <div class="page-header">
    <div>
      <h1><i class="fas fa-building"></i> Manage Companies</h1>
      <p>Add, edit, or remove companies from the database</p>
    </div>
    <button class="btn" [ngClass]="showForm ? 'btn-outline-secondary' : 'btn-primary'"
            (click)="showForm ? resetForm() : showForm = true">
      <i class="fas" [ngClass]="showForm ? 'fa-times' : 'fa-plus'"></i>
      {{showForm ? 'Cancel' : 'Add Company'}}
    </button>
  </div>

  <!-- Form -->
  <div *ngIf="showForm" class="form-card mb-4 animate-scaleIn">
    <div class="form-card-header">
      <h4>
        <i class="fas" [ngClass]="editingCompany ? 'fa-edit' : 'fa-plus-circle'"></i>
        {{editingCompany ? 'Edit Company' : 'Add New Company'}}
      </h4>
    </div>
    <div class="form-card-body">
      <div class="row g-3">
        <div class="col-md-4">
          <label class="form-label">Company Name</label>
          <input type="text" class="form-control" [(ngModel)]="companyForm.name" placeholder="e.g. TCS">
        </div>
        <div class="col-md-4">
          <label class="form-label">Industry</label>
          <input type="text" class="form-control" [(ngModel)]="companyForm.industry" placeholder="e.g. IT Services">
        </div>
        <div class="col-md-4">
          <label class="form-label">Location</label>
          <input type="text" class="form-control" [(ngModel)]="companyForm.location" placeholder="e.g. Bangalore">
        </div>
        <div class="col-md-4">
          <label class="form-label">Package Offered</label>
          <input type="text" class="form-control" [(ngModel)]="companyForm.packageOffered" placeholder="e.g. 6 LPA">
        </div>
        <div class="col-md-4">
          <label class="form-label">Minimum CGPA</label>
          <input type="number" class="form-control" [(ngModel)]="companyForm.minCgpa" step="0.1" placeholder="e.g. 7.0">
        </div>
        <div class="col-md-4">
          <label class="form-label">Website</label>
          <input type="text" class="form-control" [(ngModel)]="companyForm.website" placeholder="https://...">
        </div>
        <div class="col-12">
          <label class="form-label">Description</label>
          <textarea class="form-control" [(ngModel)]="companyForm.description" rows="2"
                    placeholder="Brief description about the company"></textarea>
        </div>
        <div class="col-12">
          <label class="form-label">Eligible Branches (comma separated)</label>
          <input type="text" class="form-control" [(ngModel)]="eligibleBranchesInput" placeholder="CSE, IT, ECE">
        </div>
      </div>
    </div>
    <div class="form-card-footer">
      <button class="btn btn-primary me-2" (click)="saveCompany()">
        <i class="fas fa-save"></i> {{editingCompany ? 'Update' : 'Save'}}
      </button>
      <button class="btn btn-outline-secondary" (click)="resetForm()">Cancel</button>
    </div>
  </div>

  <!-- Grid -->
  <div class="grid-card">
    <ag-grid-angular
      *ngIf="companies.length > 0"
      class="ag-theme-alpine"
      [rowData]="companies"
      [columnDefs]="columnDefs"
      [defaultColDef]="defaultColDef"
      [animateRows]="true"
      [domLayout]="'autoHeight'"
      (gridReady)="onGridReady($event)"
      (cellClicked)="onCellClicked($event)">
    </ag-grid-angular>
    <div *ngIf="companies.length === 0" class="empty-state">
      <div class="empty-icon"><i class="fas fa-building"></i></div>
      <h4>No companies yet</h4>
      <p>Add your first company to get started</p>
    </div>
  </div>
</div>
