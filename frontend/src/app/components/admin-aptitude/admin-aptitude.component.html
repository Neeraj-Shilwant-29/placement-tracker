<div class="admin-page animate-fadeIn">

  <div class="page-header">
    <div>
      <h1><i class="fas fa-brain"></i> Aptitude Questions</h1>
      <p>Add or manage aptitude test questions</p>
    </div>

    <button class="btn"
            [ngClass]="showForm ? 'btn-outline-secondary' : 'btn-primary'"
            (click)="showForm ? resetForm() : showForm = true">

      <i class="fas" [ngClass]="showForm ? 'fa-times' : 'fa-plus'"></i>
      {{showForm ? 'Cancel' : 'Add Question'}}

    </button>
  </div>


  <!-- Success Message -->
  <div *ngIf="successMessage"
       class="alert alert-success alert-dismissible fade show mb-3"
       role="alert">

    <i class="fas fa-check-circle me-2"></i>
    {{successMessage}}

    <button type="button"
            class="btn-close"
            (click)="successMessage=''">
    </button>

  </div>



  <!-- Form -->
  <div *ngIf="showForm"
       class="form-card mb-4 animate-scaleIn">


    <div class="form-card-header">

      <h4>
        <i class="fas"
           [ngClass]="editingQuestion ? 'fa-edit' : 'fa-plus-circle'">
        </i>

        {{editingQuestion ? 'Edit Question' : 'Add Aptitude Question'}}

      </h4>

    </div>




    <div class="form-card-body">

      <div class="row g-4">


        <!-- Question -->

        <div class="col-12">

          <label class="form-label">
            Question
          </label>

          <textarea
            class="form-control"
            rows="3"
            [(ngModel)]="form.question"
            placeholder="Enter the question text">
          </textarea>

        </div>





        <!-- Option A -->

        <div class="col-md-3">

          <label class="form-label">
            Option A
          </label>

          <input type="text"
                 class="form-control"
                 [(ngModel)]="form.optionA"
                 placeholder="Enter option A">

        </div>




        <!-- Option B -->

        <div class="col-md-3">

          <label class="form-label">
            Option B
          </label>

          <input type="text"
                 class="form-control"
                 [(ngModel)]="form.optionB"
                 placeholder="Enter option B">

        </div>





        <!-- Option C -->

        <div class="col-md-3">

          <label class="form-label">
            Option C
          </label>

          <input type="text"
                 class="form-control"
                 [(ngModel)]="form.optionC"
                 placeholder="Enter option C">

        </div>





        <!-- Option D -->

        <div class="col-md-3">

          <label class="form-label">
            Option D
          </label>

          <input type="text"
                 class="form-control"
                 [(ngModel)]="form.optionD"
                 placeholder="Enter option D">

        </div>






        <!-- Correct Answer -->

        <div class="col-md-4">

          <label class="form-label">
            Correct Answer
          </label>

          <select class="form-select"
                  [(ngModel)]="form.correctAnswer">

            <option value="">Select Answer</option>
            <option value="A">Option A</option>
            <option value="B">Option B</option>
            <option value="C">Option C</option>
            <option value="D">Option D</option>

          </select>

        </div>





        <!-- Category -->

        <div class="col-md-4">

          <label class="form-label">
            Category
          </label>

          <select class="form-select"
                  [(ngModel)]="form.category">

            <option value="">Select Category</option>
            <option value="Quantitative">Quantitative</option>
            <option value="Verbal">Verbal</option>
            <option value="Logical">Logical</option>

          </select>

        </div>





        <!-- Difficulty -->

        <div class="col-md-4">

          <label class="form-label">
            Difficulty
          </label>

          <select class="form-select"
                  [(ngModel)]="form.difficulty">

            <option value="">Select Difficulty</option>
            <option value="Easy">Easy</option>
            <option value="Medium">Medium</option>
            <option value="Hard">Hard</option>

          </select>

        </div>



      </div>

    </div>





    <div class="form-card-footer">

      <button class="btn btn-primary me-2"
              (click)="saveQuestion()">

        <i class="fas fa-save"></i>
        {{editingQuestion ? 'Update' : 'Save'}}

      </button>



      <button class="btn btn-outline-secondary"
              (click)="resetForm()">

        Cancel

      </button>

    </div>


  </div>





  <!-- Grid -->

  <div class="grid-card">

    <ag-grid-angular
      *ngIf="questions.length > 0"
      class="ag-theme-alpine"
      [rowData]="questions"
      [columnDefs]="columnDefs"
      [defaultColDef]="defaultColDef"
      [animateRows]="true"
      [domLayout]="'autoHeight'"
      (gridReady)="onGridReady($event)"
      (cellClicked)="onCellClicked($event)">
    </ag-grid-angular>



    <div *ngIf="questions.length === 0"
         class="empty-state">

      <div class="empty-icon">
        <i class="fas fa-brain"></i>
      </div>

      <h4>No aptitude questions yet</h4>

      <p>Add your first question to get started</p>

    </div>


  </div>


</div>
