<div class="app-shell" [class.sidebar-collapsed]="sidebarCollapsed">
  <!-- Mobile overlay -->
  <div class="mobile-overlay" [class.active]="mobileMenuOpen" (click)="closeMobileMenu()"></div>

  <!-- Sidebar -->
  <aside class="sidebar" [class.mobile-open]="mobileMenuOpen">
    <div class="sidebar-header">
      <a class="brand" routerLink="/admin/dashboard" (click)="closeMobileMenu()">
        <i class="fas fa-shield-alt"></i>
        <span class="brand-text">Admin Panel</span>
      </a>
    </div>

    <nav class="sidebar-nav">
      <span class="nav-section-label">Overview</span>

      <a class="nav-item" routerLink="/admin/dashboard" routerLinkActive="active"
         [routerLinkActiveOptions]="{exact: true}" (click)="closeMobileMenu()">
        <i class="fas fa-th-large"></i>
        <span>Dashboard</span>
      </a>

      <span class="nav-section-label">Content Management</span>

      <a class="nav-item" routerLink="/admin/companies" routerLinkActive="active"
         (click)="closeMobileMenu()">
        <i class="fas fa-building"></i>
        <span>Companies</span>
      </a>
      <a class="nav-item" routerLink="/admin/aptitude" routerLinkActive="active"
         (click)="closeMobileMenu()">
        <i class="fas fa-brain"></i>
        <span>Aptitude Questions</span>
      </a>
      <a class="nav-item" routerLink="/admin/coding" routerLinkActive="active"
         (click)="closeMobileMenu()">
        <i class="fas fa-code"></i>
        <span>Coding Questions</span>
      </a>

      <span class="nav-section-label">Account</span>

      <button class="nav-item nav-button logout-item" (click)="logout()">
        <i class="fas fa-sign-out-alt"></i>
        <span>Sign Out</span>
      </button>
    </nav>

    <div class="sidebar-footer">
      <div class="sidebar-user">
        <div class="user-avatar">{{getInitial()}}</div>
        <div class="user-info">
          <strong>{{getFirstName()}}</strong>
          <small>{{user?.email}}</small>
        </div>
      </div>
    </div>
  </aside>

  <!-- Main area -->
  <div class="main-area">
    <header class="topbar">
      <button class="collapse-toggle d-none d-lg-flex" (click)="toggleSidebar()">
        <i class="fas" [ngClass]="sidebarCollapsed ? 'fa-indent' : 'fa-outdent'"></i>
      </button>

      <div class="topbar-right">
        <span class="admin-badge">
          <i class="fas fa-shield-alt"></i> Admin
        </span>
        <div class="topbar-user">
          <div class="topbar-avatar">{{getInitial()}}</div>
          <span class="topbar-name d-none d-md-inline">{{getFirstName()}}</span>
        </div>
      </div>
    </header>

    <main class="content-area">
      <router-outlet></router-outlet>
    </main>
  </div>
</div>
