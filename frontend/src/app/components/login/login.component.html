<div class="auth-container">
  <div class="auth-bg"></div>
  <div class="auth-card animate-scaleIn">
    <div class="auth-card-header">
      <div class="auth-logo">
        <i class="fas fa-graduation-cap"></i>
      </div>
      <h2>Welcome Back</h2>
      <p>Sign in to continue your preparation journey</p>
    </div>

    <div class="auth-card-body">
      <div *ngIf="error" class="alert alert-danger">
        <i class="fas fa-exclamation-circle"></i> {{error}}
      </div>

      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
        <div class="form-group">
          <label class="form-label">
            <i class="fas fa-envelope"></i> Email Address
          </label>
          <input type="email" class="form-control" formControlName="email"
                 placeholder="you@college.edu">
        </div>

        <div class="form-group">
          <label class="form-label">
            <i class="fas fa-lock"></i> Password
          </label>
          <input type="password" class="form-control" formControlName="password"
                 placeholder="Enter your password">
        </div>

        <button type="submit" class="btn btn-primary btn-block" [disabled]="loading">
          <span *ngIf="loading" class="spinner-border spinner-border-sm me-2"></span>
          {{loading ? 'Signing in...' : 'Sign In'}}
        </button>
      </form>
    </div>

    <div class="auth-card-footer">
      <p>Don't have an account? <a routerLink="/register">Create one now</a></p>
      <div class="auth-divider">
        <span>or</span>
      </div>
      <a routerLink="/admin/login" class="btn btn-outline-secondary btn-block btn-sm">
        <i class="fas fa-shield-alt"></i> Admin Login
      </a>
      <a routerLink="/" class="back-link">
        <i class="fas fa-arrow-left"></i> Back to Home
      </a>
    </div>
  </div>
</div>
